name: Unpack AR source
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded AR archive
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf .ar_unpack
          mkdir .ar_unpack
          unzip -o "$ZIP" -d .ar_unpack
          cp -a .ar_unpack/. .
          rm -rf .ar_unpack "$ZIP"
      - name: Commit extracted site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Unpack original AR site"
          git push
